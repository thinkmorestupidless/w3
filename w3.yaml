# w3 renders a GitHub account as a static website. This file is the site's only hand-kept data:
# the site itself, then the families of work in the order they appear.
#
# A repository joins a family by carrying its own `w3.yaml` at the root of its default branch
# (`family: <slug>`, optionally `description`, `kind: produced | frozen` and `order`). The lists
# here are for repositories that cannot carry one: `repos:` for ones you would rather not edit,
# in order, the first being the family's root; `produced:` for ones a release job pushes by
# subtree; `private:` for ones that exist but are not public, shown as a dashed circle, never
# fetched. A repository in no family is counted, not shown.
#
# `lite` and `deep` are the family colour's tint and shade, used for the circles: light has
# shipped, dark has not.

site:
  owner: thinkmorestupidless          # the GitHub account rendered: a user or an organisation
  repo: w3                            # the repository this site is built from; used for edit links
  url: https://thinkmorestupidless.com
  domain: thinkmorestupidless.com     # written to dist/CNAME for GitHub Pages; remove for none
  title: thinkmorestupidless
  wordmark: "think more, stupid"      # the big line on the home page ...
  accent: "less."                     # ... and the word of it set in the accent colour
  intro: >-
    Trevor. Six families of work, one poster each, and every circle a repository. Roll over a
    circle for what it is and where it stands. Nothing here was written for this site.
  description: "thinkmorestupidless: six families of work, rendered from GitHub."
  nav:
    - { label: families, href: "/#families" }
    - { label: writing, href: "/writing/" }
    - { label: the honest list, href: "/honest/" }
    - { label: about, href: "/about/" }
  links:
    - { label: github, href: "https://github.com/thinkmorestupidless" }
    - { label: rss, href: "/rss.xml" }
    - { label: email, href: "mailto:trevor@thinkmorestupidless.com" }
    - { label: "eitheror, the other company", href: "https://eitheror.io" }

families:
  - slug: ankka
    name: ankka
    label: the platform
    thesis: >-
      A serverless application platform for agentic AI on the actor model. Akka's component
      model, reimplemented in Scala 3 on Apache Pekko, so nothing on the path carries a BSL
      licence. The rest of the family proves it by being its own customer.
    colour: "#D83A12"
    text: "#F4EFE3"
    lite: "#FFC9B5"
    deep: "#7A1E07"
    brain: ankka-brain
    repos:
      - ankka
      - ankka-flow
      - ankka-reasoning
      - ankka-contrib
      - ankka-satisfaction
      - ankka-experiment-proposals
      - cloudflow
    produced:
      - ankka.g8
      - ankka-action
      - ankka-marketplace
      - homebrew-tap
    private:
      - name: the hosted product
        description: turns a stranger into a customer with an organization on an installation
      - name: the infrastructure
        description: where installations live; owns the registry and the release identity
      - name: replication
        description: event sourced entities replicated across installations; the paid half of a seam the platform defines

  - slug: voice
    name: voice
    label: civic participation
    thesis: >-
      A person talks to it, in private, about what matters to them. What they choose to share
      joins what everyone else is saying, and the people elected to act on it see it and answer.
      A political system that can finally listen. Built on ankka, as its customer.
    colour: "#1F5FA8"
    text: "#F4EFE3"
    lite: "#BFD6F2"
    deep: "#0D2E57"
    brain: voice-brain
    repos:
      - voice
      - voice-website

  - slug: brains
    name: brains
    label: context for people and agents
    thesis: >-
      One small repository per family that holds what a person or an agent needs before touching
      the work: the map, the pins, the decisions and why, the traps and the voice. One source,
      many references. This site is one more consumer of them.
    colour: "#5B7A2E"
    text: "#F4EFE3"
    lite: "#D5E6B5"
    deep: "#2C3F14"
    repos:
      - ankka-brain
      - voice-brain
      - speckit-bdd
      - claude-marketplace
    private:
      - name: ankka-brain-private
        description: extends ankka-brain with the installations and the hosted product; named here, not shown

  - slug: betting
    name: betting
    label: numbers against a market
    thesis: >-
      Libraries and services around the Betfair exchange: the API clients, the data schemas and
      the experiments that use them. Honest signal only; a record carries its method and its
      caveat or it is not shown.
    colour: "#16181A"
    text: "#F2B134"
    lite: "#F2B134"
    deep: "#7A5A12"
    repos:
      - less-stupid-betting
      - less-stupid-betfair
      - betfair-akka
      - opta-data-schemae
      - premier-league-chat
      - sms-horse-tips
      - play-ws-betfair

  - slug: odds-and-ends
    name: odds & ends
    label: made because they were fun
    thesis: >-
      Smaller things that stand on their own. Some shipped, some stopped when they had answered
      their question. Kept because they show the hands, not just the platform.
    colour: "#D9D3C6"
    text: "#16181A"
    lite: "#16181A"
    deep: "#8F8A7E"
    repos:
      - papercast
      - energy-monitoring-manufacturing-demo
      - PaintingByNumbersIFY
      - superset-langchain-demo
      - processing-sphere-particles
      - may-thy-knife-chip-and-shatter
      - bennyhillmachine
      - jep-visualiser

  - slug: self-hosted-ai
    name: self-hosted ai
    label: videos, planned
    thesis: >-
      Running models on hardware you own, shown end to end on video: what to buy, what it can and
      cannot run, what it costs to keep on, and what breaks. Private by default, as everything
      else here.
    colour: "#6B4FBB"
    text: "#F4EFE3"
    lite: "#D9CCF5"
    deep: "#2F1F5E"
    repos: []

